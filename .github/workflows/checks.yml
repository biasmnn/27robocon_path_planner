name: Planner checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Check generated maps, routes, UI and exports
        run: python run_checks.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-check-output
          path: out/
          if-no-files-found: ignore
